name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    name: crypto core (C, host + freestanding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run KAT + NIST GCM + tamper + contract tests
        run: make crypto-test
      - name: Freestanding compile + undefined-symbol check
        run: make freestanding-check
      - name: LOC ledger
        run: make loc

  boot:
    name: boot chain (zig bootloader + rust kernel in QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.13.0 (sha256-pinned, supply-chain audited)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig" && tar -xf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install QEMU + OVMF + mtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf mtools
      - name: Headless boot + blind IPC encrypted echo test (OVMF -> loader -> kernel)
        run: make boot-test OVMF_DIR=/usr/share/ovmf

  proof:
    name: Isabelle/HOL specs (capability algebra + blind IPC)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Isabelle heaps cache
        uses: actions/cache@v4
        with:
          path: ~/.isabelle
          key: isabelle2024-hol-v1
      - name: Install Isabelle2024 (verified permanent URL + fallbacks)
        run: |
          set -e
          # v0.7.0 postmortem: every previously listed mirror was dead or
          # unreachable from GH runners (Cambridge only carries the latest
          # release; unej.fr does not resolve; cit.tum.de 404s). The
          # PERMANENT versioned-website path on in.tum.de serves 200 and
          # is primary; the canonical dist path and its redirect target
          # are fallbacks. Every attempt is hard-bounded.
          for u in \
            "https://isabelle.in.tum.de/website-Isabelle2024/dist/Isabelle2024_linux.tar.gz" \
            "https://isabelle.in.tum.de/dist/Isabelle2024_linux.tar.gz" \
            "http://dists.isabelle.cit.tum.de/dist/Isabelle2024_linux.tar.gz?token=Isabelle"; do
            echo "trying $u"
            if curl -fSL --connect-timeout 30 --max-time 900 -o /tmp/isabelle.tar.gz "$u"; then break; fi
            rm -f /tmp/isabelle.tar.gz
          done
          if [ -s /tmp/isabelle.tar.gz ]; then
            sudo mkdir -p /opt && sudo tar -xf /tmp/isabelle.tar.gz -C /opt
            echo "/opt/Isabelle2024/bin" >> "$GITHUB_PATH"
          else
            echo "all mirrors failed — falling back to the Docker Hub image"
            echo "ISABELLE_DOCKER=1" >> "$GITHUB_ENV"
          fi
      - name: Build RedOS proof sessions (native, or Docker fallback)
        run: |
          set -e
          if [ "${ISABELLE_DOCKER:-0}" = "1" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE/proof:/work/proof" \
              makarius/isabelle:Isabelle2024 bash -c \
              'isabelle build -b HOL && isabelle build -v -D /work/proof'
          else
            isabelle build -b HOL
            isabelle build -v -D proof/
          fi
      - name: Build HOL image (skipped by cache on later runs)
        run: isabelle build -b HOL
      - name: Build RedOS proof sessions
        run: isabelle build -v -D proof/
